# Profiling collector: eBPF receiver, two-tier export.
#
#   profiling ──┬─► profilingmetrics ─► metrics ─► Dynatrace   (always on, cheap)
#               └─► profilestologs   ─► logs    ─► Dynatrace   (gated to sessions)
#
# Metrics tell you WHERE to look. Logs tell you WHAT the call path was.
apiVersion: v1
kind: ConfigMap
metadata:
  name: collector-config
  namespace: dotnet-profiler
data:
  config.yaml: |
    receivers:
      profiling:
        # The existing DaemonSet runs at 19. Kept identical so a side-by-side
        # comparison against it is measuring the connector, not the sample rate.
        samples_per_second: 19
        # Without this, service.name resolves to null on every record: the
        # transform below reads process.environment_variable.OTEL_SERVICE_NAME,
        # and the receiver does not collect env vars unless asked. Verified the
        # hard way -- the first run produced correct stacks with no service
        # attribution at all.
        include_env_vars: "OTEL_SERVICE_NAME,OTEL_RESOURCE_ATTRIBUTES"

      # Spans from the profiled application. Needed for the correlation story:
      # profile samples join to spans in DQL on thread.id plus time window, so the
      # spans have to exist in the same tenant.
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

    processors:
      memory_limiter:
        check_interval: 5s
        limit_percentage: 80
        spike_limit_percentage: 25

      k8sattributes:
        auth_type: serviceAccount
        passthrough: false
        extract:
          metadata:
            - k8s.pod.name
            - k8s.pod.uid
            - k8s.namespace.name
            - k8s.node.name
            - k8s.deployment.name
            - k8s.container.name
            - container.id
            - container.image.name
            - container.image.tag
        pod_association:
          - sources:
              - from: resource_attribute
                name: k8s.pod.uid
          - sources:
              - from: resource_attribute
                name: container.id

      # Derive service.name from the profiled process, NEVER upsert a constant.
      #
      # The pipeline running today does `upsert service.name = "node-profiler"` at
      # resource level, which collapsed 112 distinct profiled processes into a
      # single identity. That destroys attribution and makes scoping-by-service
      # impossible, which is the main cost lever.
      transform/service_name:
        error_mode: ignore
        profile_statements:
          - context: resource
            statements:
              - set(attributes["service.name"], attributes["process.environment_variable.OTEL_SERVICE_NAME"])
                where attributes["process.environment_variable.OTEL_SERVICE_NAME"] != nil
              - set(attributes["service.name"], attributes["k8s.deployment.name"])
                where attributes["service.name"] == nil and attributes["k8s.deployment.name"] != nil
              - set(attributes["service.name"], attributes["process.executable.name"])
                where attributes["service.name"] == nil
              - delete_key(attributes, "process.environment_variable.OTEL_SERVICE_NAME")

      resource/cluster:
        attributes:
          - key: k8s.cluster.name
            value: "YOUR-CLUSTER"
            action: upsert
          - key: k8s.node.name
            value: "${env:NODE_NAME}"
            action: upsert

      batch:
        timeout: 10s
        send_batch_size: 512

    connectors:
      profilingmetrics:
        flush_interval: 30s

      profilestologs:
        max_folded_chars: 30000
        resource_marker:
          dt.openpipeline.source: dotnet-profiler
        gating:
          # Validation is done, so this is back on. With no active session the
          # per-stack tier emits nothing; the metrics tier keeps running and is what
          # covers the pre-problem window. To validate again, flip to false briefly
          # rather than leaving it off.
          enabled: true
          session_file: /etc/profiler-sessions/sessions.json
          reload_interval: 5s

    exporters:
      otlphttp/dynatrace:
        # PROTOBUF-ONLY endpoint. application/json returns 415 even with a valid
        # OTLP payload -- measured. This exporter emits protobuf natively, which is
        # why export goes through the collector rather than hand-rolled HTTP.
        # Tenant comes from the secret, never the manifest -- a tenant id in a
        # tracked file is an identifier published to whoever can read the repo.
        endpoint: "${env:DT_ENDPOINT}/api/v2/otlp"
        headers:
          Authorization: "Api-Token ${env:DT_API_TOKEN}"
        retry_on_failure:
          enabled: true
          initial_interval: 5s
          max_interval: 30s
          max_elapsed_time: 300s
        sending_queue:
          enabled: true
          num_consumers: 4
          queue_size: 100

      debug:
        verbosity: basic

    service:
      telemetry:
        logs:
          level: info
      pipelines:
        # Enrichment happens HERE, upstream of the connectors, so both tiers
        # inherit identical resource attributes from one place.
        #
        # It was originally on the two downstream pipelines instead, which silently
        # did nothing: transform/service_name declares profile_statements, and a
        # logs pipeline needs log_statements. No error, no warning -- service.name
        # was simply null on every record. Enriching before the fan-out avoids the
        # whole class of mistake and removes the duplication.
        profiles:
          receivers: [profiling]
          processors: [memory_limiter, k8sattributes, transform/service_name, resource/cluster]
          exporters: [profilingmetrics, profilestologs]

        metrics/from-profiles:
          receivers: [profilingmetrics]
          processors: [batch]
          exporters: [otlphttp/dynatrace, debug]

        logs/from-profiles:
          receivers: [profilestologs]
          processors: [batch]
          exporters: [otlphttp/dynatrace, debug]

        traces:
          receivers: [otlp]
          processors: [memory_limiter, k8sattributes, batch]
          exporters: [otlphttp/dynatrace]

        # The EventPipe half arrives here. Without this pipeline the otlp receiver
        # accepts no logs at all, and the agent's records vanish with no error on
        # either side -- the agent reports success because the SDK queued them, and
        # the collector never sees them. Cost an entire validation run to find.
        logs/from-agent:
          receivers: [otlp]
          processors: [memory_limiter, k8sattributes, batch]
          exporters: [otlphttp/dynatrace, debug]
---
apiVersion: v1
kind: Service
metadata:
  name: dotnet-profiler-collector
  namespace: dotnet-profiler
spec:
  selector:
    app: dotnet-profiler-collector
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
    - name: otlp-http
      port: 4318
      targetPort: 4318
---
# Active profiling sessions, written by the broker. Empty until one exists.
#
# A ConfigMap rather than an HTTP endpoint because this is a DaemonSet: the broker
# writes once and every node observes it, instead of enumerating pods and fanning
# out N calls it must then retry individually.
apiVersion: v1
kind: ConfigMap
metadata:
  name: profiler-sessions
  namespace: dotnet-profiler
data:
  sessions.json: "[]"
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: dotnet-profiler-collector
  namespace: dotnet-profiler
spec:
  selector:
    matchLabels:
      app: dotnet-profiler-collector
  template:
    metadata:
      labels:
        app: dotnet-profiler-collector
    spec:
      serviceAccountName: dotnet-profiler-collector
      # The GHCR package carries its own visibility, independent of the repository's.
      # Keeping the pull secret means package visibility can change either way
      # without breaking the next node that joins the cluster.
      imagePullSecrets:
        - name: ghcr
      # The profiler resolves processes by PID across the whole node, so it needs
      # the host PID namespace to see anything but itself.
      hostPID: true
      nodeSelector:
        kubernetes.io/arch: arm64
      tolerations:
        - operator: Exists
      containers:
        - name: collector
          image: ghcr.io/cooperjfecteau-cell/otlp-dotnet-alpine-musl-profiler/otelcol-dotnet-profiler:latest
          args:
            - --config=/etc/collector/config.yaml
            # Mandatory: without it the profiles pipeline does not start at all.
            - --feature-gates=service.profilesSupport
          securityContext:
            # Verified on-node: unprivileged_bpf_disabled=1 and
            # perf_event_paranoid=2, so CAP_BPF/CAP_PERFMON alone are not enough
            # here. Reducing this is tracked as its own question on the map.
            privileged: true
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: DT_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: dynatrace
                  key: DT_API_TOKEN
            - name: DT_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: dynatrace
                  key: DT_ENDPOINT
            - name: GOMEMLIMIT
              value: "400MiB"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: config
              mountPath: /etc/collector
            - name: sessions
              mountPath: /etc/profiler-sessions
            # The profiler attaches tracepoints (sched_process_free among them) and
            # fails to START, not degrade, without debugfs and tracefs -- privileged
            # alone is not enough, the filesystems must be mounted into the
            # container. This is the single most likely thing for an adopter to miss.
            - name: sys-kernel-debug
              mountPath: /sys/kernel/debug
            - name: sys-kernel-tracing
              mountPath: /sys/kernel/tracing
            - name: sys-fs-bpf
              mountPath: /sys/fs/bpf
            - name: sys-fs-cgroup
              mountPath: /sys/fs/cgroup
              readOnly: true
            - name: proc
              mountPath: /proc
              readOnly: true
            # Lets the profiler resolve a PID back to its container, which is what
            # makes k8sattributes able to attach pod identity to a sample.
            - name: containerd-sock
              mountPath: /run/containerd/containerd.sock
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: collector-config
        - name: sessions
          configMap:
            name: profiler-sessions
        - name: sys-kernel-debug
          hostPath:
            path: /sys/kernel/debug
        - name: sys-kernel-tracing
          hostPath:
            path: /sys/kernel/tracing
        - name: sys-fs-bpf
          hostPath:
            path: /sys/fs/bpf
        - name: sys-fs-cgroup
          hostPath:
            path: /sys/fs/cgroup
        - name: proc
          hostPath:
            path: /proc
        - name: containerd-sock
          hostPath:
            path: /run/containerd/containerd.sock
            type: Socket
