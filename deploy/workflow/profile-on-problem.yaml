# Closes the loop: Davis detects a problem, this asks the broker for a profile.
#
# Reaches the broker over EdgeConnect. The URL is a cluster-internal DNS name that
# resolves nowhere on the public internet — the tenant-side EdgeConnect
# configuration `dotnet-musl-profiler` has it as a host pattern, so Dynatrace routes
# the request through the in-cluster tunnel instead of executing it directly.
#
# Two details that fail silently if you get them wrong:
#
#   - problemEventId must be the INTERNAL event id, `event()["event.id"]`, not the
#     `P-…` display id. The wrong one is accepted and then never attaches the
#     annotation to anything.
#   - The broker answers 409 when the service is already being profiled. That is a
#     normal outcome, not a failure: the existing session's annotation already
#     carries the link this run would have produced. `isSuccess` treats it as such.
title: Profile .NET service on problem
description: >-
  On a Davis problem, ask the in-cluster broker to capture a 90-second profile of
  the affected service and annotate the problem with a link to the flame graph.

# Must be set explicitly. The API defaults a workflow created this way to PRIVATE,
# which hides it from the main Workflows list — it appears to have not been created
# at all. Nothing in the response or the creation output says so.
isPrivate: false

# The identity the automation engine acts as when running tasks.
#
# Set explicitly because it otherwise inherits whoever created the workflow — and
# `dtctl auth login` can be a DIFFERENT Dynatrace user than your browser session.
# Here dtctl was authenticated as a personal account while the console session was
# a work account, so the workflow ran on behalf of an identity that had never
# granted automation consent:
#
#   Could not run workflow task on behalf of '<actor>'.
#   Please ensure Authorization Settings are configured for this user.
#
# That consent is per-user and one-time, at
# /ui/apps/dynatrace.automations/settings/authorization — and it can only be granted
# by that user, so pointing the actor at an account nobody signs in as is a dead end.
#
# NOTE: this field is IGNORED on create. The actor is taken from whoever
# authenticated, and the API will not reassign it afterwards. It is kept here as
# documentation of the requirement, not as configuration that does anything.
#
# The working combination, found the hard way:
#   1. Whoever `dtctl auth login` authenticated as becomes the actor, permanently.
#   2. That same user must be signed in to the console and must have granted
#      Authorization Settings.
#   3. The credential in the vault must NOT be restricted to owner-only access, or
#      the task fails even with everything else correct. Uncheck that when creating
#      the credential if anyone other than its creator will run the workflow.
#
# Re-running `dtctl auth login` does not necessarily switch accounts: an active
# browser SSO session is reused silently, and dtctl reports the old identity. Sign
# out of Dynatrace SSO first, or use a private window, if you need a different one.
actor: 224f4223-ba8a-467c-92a3-96b579481158

trigger:
  eventTrigger:
    triggerConfiguration:
      type: davis-problem
      value:
        # Deliberately narrow. This triggers billable ingest, so it should fire on
        # the workload the pipeline is built around rather than on everything Davis
        # notices.
        #
        # `categories` is required by the API even though the UI implies it is
        # optional; omitting it fails with "categories: Field required".
        # Resource and slowdown are the two that a CPU/GC/lock profile can actually
        # explain — an availability problem is rarely a profiling question.
        categories:
          resource: true
          slowdown: true
          availability: false
          error: false
          custom: false
        entityTagsMatch: all
        entityTags:
          app: dotnet-profiler-demo
        onProblemClose: false

tasks:
  start_profile:
    name: start_profile
    description: POST to the broker over EdgeConnect
    action: dynatrace.automations:http-function
    input:
      url: http://profiler-broker.dotnet-profiler.svc.cluster.local/sessions
      method: POST
      headers:
        Content-Type: application/json
      # Structured credential reference, NOT a template expression in a header.
      #
      # `{{ credential_vault(...) }}` fails with "Undefined variables:
      # credential_vault" — that function only exists inside a Run JavaScript action.
      # The HTTP action reads the vault through this block instead, and injects it
      # into the standard Authorization header. It cannot populate a custom header,
      # which is why the broker accepts Bearer auth rather than X-Broker-Token.
      #
      # The vault id is assigned by Dynatrace and is not derived from the credential
      # name, so it must be filled in after creating the credential.
      #
      # The credential itself must permit this caller: scope AppEngine, app access
      # Workflows, and owner-or-actor access. A correctly referenced credential the
      # workflow is not allowed to read fails the same way a missing one does.
      credential:
        type: token
        tokenPrefix: Bearer
        credentialId: CREDENTIALS_VAULT-69A2C75190942059
      # The problem fields are emitted only when there IS a problem.
      #
      # On a manual run `event()` is undefined, and referencing it fails the whole
      # task with "undefined variables event,id" — so a workflow written only for the
      # trigger path cannot be tested by clicking Run, which is the first thing
      # anyone does. Guarding on `event()` makes a manual run produce a valid
      # profiling session with no annotation, which is exactly the right behaviour:
      # the broker treats both fields as optional and skips the annotation when
      # there is no problem to attach it to.
      payload: |
        {
          "service": "dotnet-profiler-demo",
          "namespace": "dotnet-profiler",
          "durationSeconds": 90
          {%- if event() %},
          "problemEventId": "{{ event()['event.id'] | default('') }}",
          "entityId": "{{ event()['affected_entity_ids'] | default([]) | first | default('') }}"
          {%- endif %}
        }
      # No isSuccess expression. The default treats 2xx as success, which is right
      # for the 202 this normally returns.
      #
      # The nuance it would have expressed: a 409 means "this service is already
      # being profiled", which is a correct outcome rather than a failure — the
      # existing session's annotation already carries the link this run would have
      # produced. With the default rule a 409 marks the task failed, which is
      # cosmetically wrong and functionally harmless.
      #
      # Left out deliberately rather than guessed at: `result('start_profile')` fails
      # with "error evaluating isSuccess", and the expression dialect for referencing
      # a task's own response is not documented anywhere I could find. Not worth
      # burning test cycles on to make a 409 render green.
