name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  # Stage 1 validates the connector on its own. Kept separate from the ocb build on
  # purpose: a wrong module version in the distribution manifest would otherwise
  # mask whether the connector code itself compiles, and there is no local Go
  # toolchain to fall back on, so each CI run has to yield maximum signal.
  connector:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: connector/profilestologsconnector/go.sum

      - name: Resolve dependencies
        working-directory: connector/profilestologsconnector
        run: go mod tidy

      - name: Vet
        working-directory: connector/profilestologsconnector
        run: go vet ./...

      - name: Test
        working-directory: connector/profilestologsconnector
        run: go test -v ./...

      - name: Build
        working-directory: connector/profilestologsconnector
        run: go build ./...

      - name: Print resolved versions
        # Echoed to the log rather than uploaded as an artifact: this account's
        # Actions artifact storage quota is exhausted, and an upload failure was
        # aborting the job before the steps that actually matter had run.
        if: always()
        working-directory: connector/profilestologsconnector
        run: |
          echo "----- go.mod -----"
          cat go.mod
          echo "----- direct requires resolved -----"
          go list -m all | head -40

  # Stage 2 assembles the full distribution. Runs even when stage 1 fails, so one
  # push surfaces problems in both the connector and the manifest rather than
  # serialising them across two round trips.
  distribution:
    runs-on: ubuntu-latest
    needs: connector
    if: always()
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Install builder
        run: |
          go install go.opentelemetry.io/collector/cmd/builder@v0.158.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Build distribution
        run: builder --config distribution/manifest.yaml

      - name: Smoke test the binary
        # `components` lists everything registered. If our connector is missing from
        # the output the build silently produced a useless collector, which a plain
        # exit-zero build would not catch.
        #
        # The binary is located rather than assumed: ocb resolves output_path
        # relative to the working directory, not the manifest, so it does not land
        # under distribution/.
        run: |
          set -euo pipefail
          BIN="$(find . -type f -name 'otelcol-dotnet-profiler' | head -1)"
          if [ -z "$BIN" ]; then
            echo "::error::built binary not found"
            find . -maxdepth 3 -type d -name '_build'
            exit 1
          fi
          echo "binary: $BIN"
          "$BIN" components > components.yaml
          cat components.yaml
          for want in profilestologs profilingmetrics profiling; do
            grep -q "$want" components.yaml || {
              echo "::error::component '$want' is not registered in the built binary"
              exit 1
            }
          done
          echo "BIN=$BIN" >> "$GITHUB_ENV"

      - name: Upload binary
        # Non-fatal: artifact storage quota on this account is exhausted, and a
        # failed upload must not mask a successful build.
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: otelcol-dotnet-profiler
          path: _build/

  # Publishes the image the DaemonSet actually runs. This is the step that makes
  # the project adoptable at all: the pipeline currently on the cluster depends on
  # a bespoke image in a private ECR that nobody else can pull.
  image:
    runs-on: ubuntu-latest
    needs: distribution
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Install builder
        run: |
          go install go.opentelemetry.io/collector/cmd/builder@v0.158.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Cross-compile for arm64 and amd64
        # The target cluster is Graviton (t4g.large, aarch64), so arm64 is the one
        # that matters; amd64 is built so the reference implementation is not
        # accidentally arm-only for adopters.
        run: |
          set -euo pipefail
          for arch in arm64 amd64; do
            echo "::group::build $arch"
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" builder --config distribution/manifest.yaml
            mv _build/otelcol-dotnet-profiler "_build/otelcol-dotnet-profiler-$arch"
            echo "::endgroup::"
          done
          ls -l _build/

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: distribution/Dockerfile
          platforms: linux/arm64,linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/otelcol-dotnet-profiler:latest
            ghcr.io/${{ github.repository }}/otelcol-dotnet-profiler:${{ github.sha }}
